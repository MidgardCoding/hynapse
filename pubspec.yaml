name: hynapse
description: "Hynapse — space-grade cognitive readiness companion."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  isar_community: 3.4.1
  isar_community_flutter_libs: 3.4.1
  path_provider: ^2.1.5
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  isar_community_generator: 3.4.1

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: Bungee
      fonts:
        - asset: assets/fonts/Bungee/Bungee-Regular.ttf
    - family: SansExpanded
      fonts:
        - asset: assets/fonts/SansExpanded/EncodeSansExpanded-Thin.ttf
          weight: 100
        - asset: assets/fonts/SansExpanded/EncodeSansExpanded-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/SansExpanded/EncodeSansExpanded-Light.ttf
          weight: 300
        - asset: assets/fonts/SansExpanded/EncodeSansExpanded-Regular.ttf
          weight: 400
        - asset: assets/fonts/SansExpanded/EncodeSansExpanded-Medium.ttf
          weight: 500
        - asset: assets/fonts/SansExpanded/EncodeSansExpanded-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SansExpanded/EncodeSansExpanded-Bold.ttf
          weight: 700
        - asset: assets/fonts/SansExpanded/EncodeSansExpanded-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/SansExpanded/EncodeSansExpanded-Black.ttf
          weight: 900
